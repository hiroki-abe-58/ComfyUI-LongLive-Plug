[project]
name = "comfyui-longlive-plug"
version = "0.1.0"
description = "Unofficial ComfyUI integration of NVlabs LongLive-Plug few-step/CFG LoRA adapters for Wan2.1-T2V-14B, with key-coverage checks and upstream-verified sampling recipes."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/hiroki-abe-58/ComfyUI-LongLive-Plug"
"Bug Tracker" = "https://github.com/hiroki-abe-58/ComfyUI-LongLive-Plug/issues"

[tool.comfy]
PublisherId = ""
DisplayName = "ComfyUI-LongLive-Plug"
Icon = ""
includes = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -p no:cacheprovider"

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["tests/data", "_comfyui"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905", "E501"]  # line length is enforced by `ruff format`; long provenance strings stay intact

[tool.ruff.lint.isort]
known-first-party = ["longlive_plug"]
known-third-party = ["comfy", "comfy_extras", "folder_paths", "nodes"]
