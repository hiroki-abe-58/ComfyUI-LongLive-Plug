[project]
# Comfy Registry node id: immutable once published.
name = "longlive-plug"
version = "0.1.0"
description = "Unofficial community integration, not affiliated with NVIDIA: applies the NVlabs LongLive-Plug Few-Step/CFG LoRA adapters to Wan2.1-T2V-14B in ComfyUI with key-coverage checks and upstream-verified 4-step sampling recipes."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
# Only what was tested with real weights: Windows 11 + NVIDIA RTX 5090.
# Linux passes the model-free CI but has no real-weight run (see README).
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Repository = "https://github.com/hiroki-abe-58/ComfyUI-LongLive-Plug"
Issues = "https://github.com/hiroki-abe-58/ComfyUI-LongLive-Plug/issues"
Documentation = "https://github.com/hiroki-abe-58/ComfyUI-LongLive-Plug#readme"
Upstream = "https://github.com/NVlabs/LongLive"

[tool.comfy]
PublisherId = "hiroki-abe-58"
DisplayName = "LongLive-Plug for ComfyUI"
Icon = ""
includes = []
# Tested with ComfyUI v0.38.0 only; older versions are not verified.
requires-comfyui = ">=0.38.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -p no:cacheprovider"

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["tests/data", "_comfyui"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905", "E501"]  # line length is enforced by `ruff format`; long provenance strings stay intact

[tool.ruff.lint.isort]
known-first-party = ["longlive_plug"]
known-third-party = ["comfy", "comfy_extras", "folder_paths", "nodes"]
